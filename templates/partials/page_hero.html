{% load i18n %}
<section class="page-hero">
	<div class="container">
		<ol class="crumbs">
			<li><a href="{% url 'home' %}">{% trans 'Домой' %}</a></li>
			{% if parent_label %}<li><a href="{{ parent_url }}">{{ parent_label }}</a></li>{% endif %}
			<li>{{ crumb|default:title|truncatechars:48 }}</li>
		</ol>
		<h1>{{ title }}</h1>
		{% if lead %}<p>{{ lead }}</p>{% endif %}
	</div>
</section>
